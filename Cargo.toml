[workspace]
resolver = "3"

[package]
name = "magick_rust"
version = "1.0.0"
edition = "2024"
authors = ["Nathan Fiedler <nathanfiedler@fastmail.fm>"]
description = "Selection of Rust bindings for the ImageMagick library."
homepage = "https://github.com/nlfiedler/magick-rust"
repository = "https://github.com/nlfiedler/magick-rust.git"
readme = "README.md"
license = "Apache-2.0"
keywords = ["magickwand", "imagemagick"]
build = "build.rs"
exclude = [
    ".github/*",
    "docker/*",
    "tests/*",
]

[dependencies]
libc = "0.2"

[build-dependencies]
bindgen = { version = "0.72.0", default-features = false, features = ["logging", "prettyplease"] }
pkg-config = "0.3"

[target.'cfg(not(target_arch = "x86_64-unknown-linux-musl"))'.build-dependencies]
bindgen = { version = "0.72.0", default-features = false, features = ["runtime"] }

[target.'cfg(target_arch = "x86_64-unknown-linux-musl")'.build-dependencies]
bindgen = { version = "0.72.0", default-features = false, features = ["static"] }

[features]
# Work-around for bindgen(?) not finding the QuantumRange definition ever since
# MagickWand 7.1.1.17 (or .16) when this suddenly stopped working.
default = ["disable-hdri"]
# Workaround for bindgen bug when ImageMagick is compiled with disable-hdri
disable-hdri = []
